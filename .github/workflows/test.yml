name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      # -race needs cgo on windows; unix runners get it.
      - run: go test -race ./...
        if: runner.os != 'Windows'
      - name: PowerShell syntax check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.Name)::$($parseErrors[0].Message)"
            }
          }
          if ($failed) { exit 1 }
      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -ldflags "-H windowsgui" -o bin/opencode-proxy.new.exe ./cmd/opencode-proxy
          # The repo config.json carries macOS-absolute state paths; the
          # default live config self-creates from defaults on first start.
          ./scripts/smoke.ps1 -Bin ./bin/opencode-proxy.new.exe
